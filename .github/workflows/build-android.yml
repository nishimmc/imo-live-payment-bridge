name: Build Android Payment Bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Do not install the legacy `tools` package here. We install only
          # the SDK packages required by this project in the next step.
          packages: ''
          cmdline-tools-version: '14742923'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install required Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Verify Android SDK
        run: |
          java -version
          sdkmanager --version
          gradle --version

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_DIR="$(find . -type f -path '*/android/settings.gradle.kts' -print -quit | xargs -r dirname)"
          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: Could not find android/settings.gradle.kts in the repository."
            echo "Repository tree:"
            find . -maxdepth 4 -type f | sort | head -200
            exit 1
          fi
          ANDROID_DIR="${ANDROID_DIR#./}"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $ANDROID_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: imo-live-payment-bridge-debug
          path: '**/android/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
