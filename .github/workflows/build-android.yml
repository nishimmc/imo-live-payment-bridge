name: Build Android Payment Bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'true'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify repository layout
        shell: bash
        run: |
          set -euxo pipefail
          pwd
          echo '--- top level ---'
          find . -maxdepth 2 -type f | sort
          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/build.gradle.kts

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          cd android
          echo "Building from: $(pwd)"
          gradle --version
          gradle --no-daemon --stacktrace --info assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: imo-live-payment-bridge-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
